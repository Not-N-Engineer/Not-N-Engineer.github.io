<!DOCTYPE HTML>
<html>
    <head>
        <title>NotNEngineer - Yujie Jin</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Mea+Culpa&display=swap" rel="stylesheet">
        <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?">
    </head>

    <body>
        <div class="binder" id="binder">
            <h1>
                Hello, I'm Yujie Jin!
            </h1>
            
            <p><a href="">Projects</a></p>
            <p><a href="">Youtube</a></p>
            <p><a href="">Poems</a></p>
            <p><a href="">Music</a></p>
        </div>
    </body>

    <script>
        const binder = document.getElementById("binder");

        document.addEventListener("mousemove", (e) => {
            const centerX = window.innerWidth/2;
            const centerY = window.innerHeight/2;

            const tiltX = -(e.clientY - centerY)/window.innerHeight * 25;
            const tiltY = ((e.clientX - centerX)/window.innerWidth * 25);

            binder.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
            binder.style.boxShadow = `${tiltY}px ${tiltX}px 15px #000000`;
        });
    </script>
</html>

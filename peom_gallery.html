<!DOCTYPE HTML>
<html>
    <head>
        <title>NotNEngineer - Yujie Jin</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Mea+Culpa&family=EB+Garamond&display=swap" rel="stylesheet">
        <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?">
    </head>

    <body>
        <div class="binder">
            <h2 class="end">
                I have been writing poems for quite some time, really spiking starting in late 2026. <br>The following is a catalogue of all poems that I could find and document. 
            </h2>
            
            <div class="tile">
                <a href="poems/Apr-6-2026.html" target="_blank" class="clickable-card">
                <h2>I can cast a spell</h2>
                <p>April 6, 2026</p>
                </a>
            </div>

            <div class="tile">
                <a href="poems/Jun-1-2026.html" target="_blank" class="clickable-card">
                <h2>Time and time</h2>
                <p>June 1, 2026</p>
                </a>
            </div>

            <p class="end"> </p>
        </div>
    </body>

    <script>
        const cards = document.querySelectorAll(".tile");

        cards.forEach((card) => {
            card.addEventListener("mousemove", (e) => {
                const rect = card.getBoundingClientRect();

                const centerX = rect.left + rect.width/2;
                const centerY = rect.top + rect.height/2;

                const tiltX = -(e.clientY - centerY)/(rect.height/2) * 15;
                const tiltY = ((e.clientX - centerX)/(rect.width/2) * 15);

                card.style.transform = `perspective(2000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
                card.style.boxShadow = `${-tiltY}px ${tiltX}px 8px #000000`;
            })

            card.addEventListener("mouseleave", () => {
                card.style.transform = `perspective(2000px) rotateX(0deg) rotateY(0deg)`;
                card.style.boxShadow = `0 2px 8px #000000`;
            })
        });
    </script>
</html>

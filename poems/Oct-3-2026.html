<!DOCTYPE HTML>
<html>
    <head>
        <title>Is it not simple</title>
        <meta charset="utf-8">
        <style>

            body {
                font-family: 'EB Garamond', serif; font-size: 11px;
            }

        </style>
    </head>

    <body>

<!--Poem-->
<pre>
Is it not simple? 
For we are men. 
Doomed to die, 
And sing and shy, 
And play and pry,

And pray. 
For we are men, 
Doomed to sigh, 

And writhe
In blissful blithe. 
</pre>

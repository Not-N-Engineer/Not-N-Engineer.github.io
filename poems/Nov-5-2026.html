<!--Poem-->
<pre>
Sometimes
I just want to sleep like a dead mime,
Counting all the sheep for a long time.
Leaving everything feeling discarded,
Lying on the floor like I’m exhausted.
Looking all around me as the shadows grow long,
Quiet in my mind as I sing this song. 
</pre>

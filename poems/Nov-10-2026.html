    <body>

<!--Poem-->
<pre>
Waiting for 9 o’clock
when the world burns to the ground

What a peaceful shock
when the world ceases its sound

Wandering the wasteland without a home
Wondering if life is better when on its own

Gas mask heavy in the storm
But now feeling kind of warm
</pre>

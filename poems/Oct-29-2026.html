<!--Poem-->
<pre>
From the dreadful reaching cold,
Comes this story we’ve been sold;
How many times have you been told:
Fall in line 
or you, he’ll scold.

From the dreadful reaching cold,
How many fall within the fold?
On and on we march into the mold,
Until we are 
or won’t be
old.
</pre>

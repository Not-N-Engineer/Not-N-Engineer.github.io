<!--Poem-->
<pre>
Just a little bit, 
Just a little bit prudent,
Just a little bit damp.

Just a little bit,
Just a little bit noisy,
Just a little bit cramped.

Just want a little bit of calm and warm,
But everything just ends up old and torn,
</pre>

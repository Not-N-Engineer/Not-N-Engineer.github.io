        <title>Time and time</title>

        <style>

            body {
                font-family: 'EB Garamond', serif; font-size: 11px;

    <body>

<!--Poem-->
<pre>
Time and time, 
come to rhyme. 

To Time and time, 
we are resigned. 

Time with time,
we'll come to sign
a cursed bind of sound remorse. 

History comes to take its course. 
</pre>

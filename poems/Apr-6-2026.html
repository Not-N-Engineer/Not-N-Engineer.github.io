        <title>I can cast a spell</title>

<!--Poem-->
<pre>
I can cast a spell
for instant curdled milk.

I could spend a thousand days, 
say a prayer a thousand different ways. 
But in the end, 
I'd be left with
instant curdled milk. 
</pre>
